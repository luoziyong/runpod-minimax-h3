name: Build CPU Pod lifecycle image

on:
  workflow_dispatch:
  push:
    branches: [codex/cpu-startup-benchmark]
    paths: [.github/workflows/pod-startup-benchmark.yml, deploy/pod-benchmark/**]

permissions:
  contents: read
  packages: write

concurrency:
  group: cpu-pod-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify probe and prepare disk
        run: |
          python3 -m unittest discover -s tests -p test_pod_benchmark.py -v
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pod-benchmark/cold.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/luoziyong/mmh3-rtx5090-cpu-benchmark:20261022
            ghcr.io/luoziyong/mmh3-rtx5090-cpu-benchmark:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/luoziyong/runpod-minimax-h3
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
